name: champions-app

on:
  push:
    paths:
      - "champions-app/**"
      - ".github/workflows/champions-app.yml"
  pull_request:
    paths:
      - "champions-app/**"
      - ".github/workflows/champions-app.yml"

defaults:
  run:
    working-directory: champions-app

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-auth-secret-for-github-actions-only-not-production
      DATABASE_URL: postgresql://ci:ci@localhost:5432/champions_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: champions-app/.nvmrc
          cache: npm
          cache-dependency-path: champions-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
