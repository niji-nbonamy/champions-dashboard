name: champions-app

on:
  push:
    paths:
      - "champions-app/**"
      - ".github/workflows/champions-app.yml"
  pull_request:
    paths:
      - "champions-app/**"
      - ".github/workflows/champions-app.yml"

defaults:
  run:
    working-directory: champions-app

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-auth-secret-for-github-actions-only-not-production
      DATABASE_URL: postgresql://ci:ci@localhost:5432/champions_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # App runtime: Node 22 (matches champions-app/.nvmrc and package.json engines)
          node-version: "22"
          cache: npm
          cache-dependency-path: champions-app/package-lock.json

      # Pin npm via package.json packageManager (11.6.2 — matches typical nvm Node 22 installs)
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
