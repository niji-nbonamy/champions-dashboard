name: champions-app

on:
  push:
    paths:
      - "champions-app/**"
      - ".github/workflows/champions-app.yml"
  pull_request:
    paths:
      - "champions-app/**"
      - ".github/workflows/champions-app.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: champions-app
    env:
      AUTH_SECRET: ci-auth-secret-for-github-actions-only-not-production
      DATABASE_URL: postgresql://ci:ci@localhost:5432/champions_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: champions-app/package-lock.json

      # Node 22 runners ship npm 10.x; lockfile is generated with npm 11.6.2 (local nvm default).
      # Must upgrade npm at repo root — defaults.working-directory is champions-app for later steps.
      - name: Pin npm to 11.6.2
        working-directory: .
        run: |
          npm install -g npm@11.6.2
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
